name: Release
run-name: Release · ${{ github.ref_name }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: creo-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Release
        uses: ./
        with:
          version-source: auto
          tag-prefix: v
          floating-tags: true
          changelog: 'true'
          if-exists: skip
          publish-to-marketplace: true
          body-template: |
            ## What's Changed

            {{changelog}}

            **Full Changelog**: {{compare_url}}
